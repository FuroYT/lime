name: iOS CI
on:
  workflow_dispatch:
  workflow_call:

jobs:
  ios:
    runs-on: macos-15-intel
    steps:

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp --quiet
          cd "$(haxelib path hxcpp | head -n 1)"
          cd tools/hxcpp
          haxe compile.hxml
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Enable HXCPP compile cache
        run: |
          echo "HXCPP_COMPILE_CACHE=~/.hxcpp" >> $GITHUB_ENV

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime $GITHUB_WORKSPACE
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (iOS)
        run: |
          lime rebuild ios -clean -eval -nocolor -nocffi -release

      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-NDLL
          path: |
            ndll/iPhone/
            !**/.gitignore
            lime.png
          if-no-files-found: error
